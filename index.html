<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Talk to Claude sessions from Meta Ray-Ban Display glasses. Messages are signed on the glasses; replies are encrypted.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://monitor.protaha.com; img-src data:; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'">
  <title>Glasses Link</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg:#000; --card:#1c1f2a; --text:#fff; --muted:#b8bccb; --busy:#5ee08a; --idle:#5ee08a; --focus:#ffd34d; --accent:#c08cff; --r:14px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
    .screen { height:100%; display:flex; flex-direction:column; padding:22px; gap:12px; }
    header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
    h1 { font-size:32px; }
    #state { font-size:20px; color:var(--accent); font-variant-numeric:tabular-nums; }
    #body { flex:1; min-height:0; overflow-y:scroll; scrollbar-width:none; display:flex; flex-direction:column; gap:10px; }
    #body::-webkit-scrollbar { display:none; }
    #body.many { gap:6px; } #body.many .row { padding:7px 16px; font-size:21px; } #body.many .row .sub { font-size:16px; } #body.many .dot { width:15px; height:15px; }
    .row { display:flex; align-items:center; gap:14px; background:var(--card); border-radius:var(--r); padding:14px 18px; border:3px solid transparent; font-size:24px; font-weight:700; }
    .row.on { border-color:var(--focus); }
    .row .sub { margin-left:auto; font-size:18px; font-weight:400; color:var(--muted); }
    .dot { width:18px; height:18px; border-radius:50%; background:#8a8fa0; flex:none; }
    .busy .dot, .idle .dot { background:#8a8fa0; }
    .msg { flex:none; border-radius:var(--r); padding:10px 16px; font-size:21px; line-height:1.35; white-space:pre-line; }
    .msg .who { display:block; font-size:16px; font-weight:700; margin-bottom:2px; letter-spacing:.04em; text-transform:uppercase; }
    .msg.claude { background:var(--card); } .msg.claude .who { color:#36c8ff; }
    .msg.you { background:#23415a; } .msg.you .who { color:var(--focus); }
    .msg.progress { background:transparent; border:1px solid var(--busy); color:var(--muted); font-family:ui-monospace,Menlo,monospace; font-size:16px; line-height:1.3; white-space:pre-wrap; word-break:break-word; }
    .msg img.thumb { display:block; margin-top:8px; max-width:100%; max-height:240px; border-radius:10px; }
    .msg.working { background:transparent; border:2px dashed var(--busy); color:var(--busy); font-style:italic; }
    .msg.listening { background:transparent; border:2px dashed #36c8ff; color:#36c8ff; }
    .msg.reading { color:var(--muted); } .msg.reading .done { color:var(--muted); opacity:.7; }
    .msg.reading .hl-s { color:var(--text); background:rgba(255,211,77,.16); border-radius:6px; }
    .msg.reading .hl-w { background:var(--focus); color:#000; border-radius:4px; }
    .taps { font-size:30px; letter-spacing:.3em; text-align:center; color:var(--focus); margin:6px 0; }
    .msg.ask { background:transparent; border:2px solid var(--focus); } .msg.ask .who { color:var(--focus); }
    .note { font-size:22px; color:var(--muted); line-height:1.4; }
    .big { font-size:24px; line-height:1.4; }
    .words { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .words span { background:var(--card); border-radius:10px; padding:8px; text-align:center; font-size:22px; }
    .words span.bad { color:#ff5c5c; } .words span.empty { color:#555; }
    .pin { display:flex; gap:16px; justify-content:center; margin:10px 0; }
    .pin span { width:64px; height:80px; border-radius:12px; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; border:3px solid transparent; }
    .pin span.on { border-color:var(--focus); }
    .help { font-size:16px; color:var(--muted); text-align:center; }
    .vol { height:22px; border-radius:11px; background:var(--card); overflow:hidden; } .vol .fill { height:100%; background:var(--idle); }
    #music { position:fixed; right:0; bottom:0; width:200px; height:200px; border:0; opacity:0; pointer-events:none; }
    /* Session rail: always on the right while unlocked. red = waiting for you, green < 1 h, orange < 24 h, grey older */
    :root { --red:#ff5c5c; --green:#5ee08a; --orange:#ffb84d; --grey:#9aa0b2; }
    body.rail-on .screen { padding-right:calc(152px * var(--railtw, 1) * var(--railz, 1) + 12px); }
    /* the strip keeps the same size when the glasses text size changes: no text autosizing, plus a measured correction (--railz) */
    #rail { position:fixed; top:16px; right:12px; bottom:16px; width:calc(140px * var(--railtw, 1)); z-index:15; display:none; flex-direction:column; gap:6px; overflow:hidden;
            zoom:var(--railz, 1); -webkit-text-size-adjust:none; text-size-adjust:none; }
    #railprobe { position:fixed; left:-9999px; top:0; width:140px; font:700 50px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; white-space:nowrap; -webkit-text-size-adjust:none; text-size-adjust:none; visibility:hidden; }
    body.rail-on #rail { display:flex; }
    #rail .rhead { font-size:17px; font-weight:800; text-align:center; padding:4px 0 2px; letter-spacing:.02em; }
    #rail .rhead.red { color:var(--red); } #rail .rhead.ok { color:var(--green); } #rail .rhead.off { color:var(--grey); }
    #rail .pill { flex:none; display:flex; flex-direction:column; gap:1px; background:var(--card); border-radius:10px; border-left:7px solid var(--grey); padding:5px 8px 5px 9px; }
    #rail .pill .rn { font-size:16px; font-weight:700; line-height:1.15; color:#fff; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }
    #rail .pill .rt { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
    #rail .pill.green { border-left-color:var(--green); } #rail .pill.green .rt { color:var(--green); }
    #rail .pill.orange { border-left-color:var(--orange); } #rail .pill.orange .rt { color:var(--orange); }
    #rail .pill.grey { border-left-color:var(--grey); } #rail .pill.grey .rt { color:var(--grey); } #rail .pill.grey .rn { color:#c9cdd8; }
    #rail .pill.red { background:#b3261e; border-left-color:#ff5c5c; } #rail .pill.red .rt { color:#fff; }
    .dot.t-red { background:var(--red); } .dot.t-green { background:var(--green); } .dot.t-orange { background:var(--orange); } .dot.t-grey { background:var(--grey); } .dot.t-ask { background:#36c8ff; }
    #rail .more { font-size:15px; color:var(--muted); text-align:center; }
    #rail.stale .pill { background:var(--card) !important; border-left-color:#555 !important; } #rail.stale .pill .rt, #rail.stale .pill .rn { color:#9aa0b2 !important; }
  </style>
</head>
<body>
  <section class="screen">
    <header><h1 id="title">Glasses Link</h1><span id="state"></span></header>
    <div id="body"></div>
    <div class="help" id="help"></div>
  </section>
  <aside id="rail" aria-label="Sessions"></aside>
  <div id="railprobe" aria-hidden="true"><span>MMMMgg</span></div>
  <script src="words.js"></script>
  <script>
  (function () {
    'use strict';
    // ---- configuration (no secrets here: this page is public) ----
    var LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
    var RELAY = LOCAL ? 'http://127.0.0.1:8791/devlink/api/' : 'https://monitor.protaha.com/devlink/api/';
    var PUB = LOCAL ? 'http://127.0.0.1:8766/pub/' : 'https://monitor.protaha.com/devlink/pub/';
    var SALT = 'glasses-devlink-v2', ITER = 200000, NWORDS = 10;
    var TARGETS = [{ id: 'hermes', name: 'hermes' }, { id: 'glasses-dev', name: 'glasses-dev' }, { id: 'claude', name: 'Ask Claude', ask: true }, { id: 'grano', name: 'Grano', noApprove: true },
                   { id: 'procurement', name: 'AFL Procurement', noApprove: true }, { id: 'afl-tracker', name: 'AFL Tracker', noApprove: true },
                   { id: 'customsez', name: 'CustomsEZ', noApprove: true }, { id: 'ksa-gda', name: 'KSA GDA', noApprove: true },
                   { id: 'security', name: 'Security', noApprove: true }, { id: 'italy', name: 'Italy trip', noApprove: true }];

    var bodyEl = document.getElementById('body'), stateEl = document.getElementById('state'),
        helpEl = document.getElementById('help'), titleEl = document.getElementById('title');
    var PAGE_V = '2026-11-25b';   // bump on every publish (glasses-link-publish.sh refuses an unchanged version)
    var enc = new TextEncoder();
    var K = null;                 // { mac, enc } non-extractable CryptoKeys + device token
    var S = { mode: 'boot', words: [], pin: [0, 0, 0, 0], at: 0, session: '', until: 0, target: 0, draft: '', msg: '',
              busy: false, reply: {}, answered: {} };

    // ---- small helpers ----
    function el(cls, text) { var d = document.createElement('div'); d.className = cls; if (text !== undefined) d.textContent = text; return d; }
    function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
    function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
    var tts = window.speechSynthesis || null, speaking = false;
    // reading = what is being read aloud, so draw() can highlight the sentence (and word, if the voice reports words) and scroll to it
    var reading = null;
    // ---- background music: YouTube's own player in an isolated frame (no YouTube script in this page) ----
    var MUSIC_ID = 'P5r8Lp4tv2M';
    var music = { on: false, frame: null, ready: false, playing: null, vol: null, level: 40, yt: -1, pausedAt: 0, kickAt: 0 };
    try { var lv = parseInt(localStorage.getItem('gl-music-vol'), 10); if (lv >= 0 && lv <= 100) music.level = lv; } catch (e) {}
    function musicCmd(func, args) {
      if (!music.frame || !music.frame.contentWindow || !music.ready) return;   // the player starts itself (autoplay); commands only once it answers
      music.frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [] }), 'https://www.youtube-nocookie.com');
    }
    function musicSync() {
      if (!music.frame) return;
      var want = music.on && !S.listening;                   // plays while the app is open; pauses only while the mic listens
      var vol = (speaking || (tts && tts.speaking)) ? Math.round(music.level * 0.35) : music.level;   // quieter while the page reads aloud
      if (want !== music.playing) { musicCmd(want ? 'playVideo' : 'pauseVideo'); music.playing = want; }
      if (want && vol !== music.vol) { musicCmd('setVolume', [vol]); music.vol = vol; }
    }
    function musicToggle() {
      music.on = !music.on;
      if (music.on && !music.frame) {
        var f = document.createElement('iframe');
        f.id = 'music'; f.title = 'Background music'; f.allow = 'autoplay; encrypted-media'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true');
        f.src = 'https://www.youtube-nocookie.com/embed/' + MUSIC_ID + '?autoplay=1&loop=1&playlist=' + MUSIC_ID + '&controls=0&disablekb=1&fs=0&enablejsapi=1&playsinline=1&vq=small';
        f.addEventListener('load', function () {
          try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'music' }), 'https://www.youtube-nocookie.com'); } catch (e) {}
          setTimeout(function () { if (!music.ready) { music.ready = true; music.playing = null; music.vol = null; musicSync(); } }, 4000);   // fallback if it never answers
        });
        document.body.appendChild(f); music.frame = f; music.playing = true;
      }
      musicSync();
    }
    window.addEventListener('message', function (ev) {          // the player answers once it is ready; only YouTube's frame is listened to
      if (ev.origin !== 'https://www.youtube-nocookie.com' || !music.frame || ev.source !== music.frame.contentWindow) return;
      var d = null; try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) {}
      var st = d && (d.info && typeof d.info.playerState === 'number' ? d.info.playerState : (d.event === 'onStateChange' && typeof d.info === 'number' ? d.info : null));
      if (st !== null && st !== undefined) musicState(st);
      if (!music.ready) { music.ready = true; music.playing = null; music.vol = null; musicSync(); }
    });
    function musicState(st) {                                    // YouTube player state: 1 playing, 2 paused, 0 ended, 3 buffering
      if (st === 2 && music.yt !== 2) music.pausedAt = Date.now();
      music.yt = st;
    }
    music.onState = musicState;
    function musicResume() {                                     // another sound (notification, call, assistant) paused the player: start it again
      if (!music.frame || !music.ready || !music.on || S.listening) return;
      var now = Date.now();
      var stopped = (music.yt === 2 || music.yt === 0) && now - music.pausedAt > 3000;   // wait 3 s so a short interruption can finish
      var unknown = music.yt === -1 && now - music.kickAt > 10000;                       // no state reports at all: nudge every 10 s (harmless if already playing)
      if ((stopped || unknown) && now - music.kickAt > 3000) { music.kickAt = now; musicCmd('playVideo'); if (music.yt === 0) musicCmd('seekTo', [0, true]); }
    }
    function keepFocus() {                                       // the player must never take the gestures: give focus back to the app
      if (music.frame && document.activeElement === music.frame) { try { music.frame.blur(); } catch (e) {} }
      if (!document.hasFocus()) { try { window.focus(); } catch (e) {} }
      if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) document.activeElement.blur();
    }
    window.addEventListener('blur', function () { if (music.frame) setTimeout(keepFocus, 0); });
    function goWindow(dir) {                                    // swipe left inside a window: next window, wrapping
      var N = TARGETS.length + 1, pos = S.mode === 'music' ? TARGETS.length : S.target;
      pos = (pos + dir + N) % N;
      stopSpeaking(); S.ltaps = 0; S.msg = '';
      if (pos === TARGETS.length) { S.onMusic = true; S.mode = 'music'; }
      else { S.onMusic = false; S.target = pos; S.mode = 'chat'; poll(); }
      bodyEl.scrollTop = 0; draw();
    }
    function musicVol(d) {
      music.level = Math.max(0, Math.min(100, music.level + d));
      try { localStorage.setItem('gl-music-vol', String(music.level)); } catch (e) {}
      musicSync();
    }
    setInterval(function () { musicSync(); musicResume(); if (music.frame && document.activeElement === music.frame) keepFocus(); }, 400);
    function stopSpeaking() { if (tts) tts.cancel(); speaking = false; reading = null; }
    function sentences(text) {                              // [start, end) of each sentence in the shown text
      var re = /[^.!?\n]+[.!?]*\s*/g, out = [], m;
      while ((m = re.exec(text))) if (m[0].trim()) out.push([m.index, m.index + m[0].length]);
      return out.length ? out : [[0, text.length]];
    }
    function speakable(t) { return t.replace(/[*#`_>]/g, ' ').replace(/•/g, '. ').replace(/https?:\/\/\S+/g, 'link'); }
    function say(text, short, follow) {
      if (!tts) return;
      text = String(text);
      var parts = sentences(text);
      tts.cancel(); speaking = !short;
      reading = follow ? { text: text, parts: parts, i: -1, w: null } : null;
      var mine = reading;
      parts.forEach(function (pp, i) {
        var orig = text.slice(pp[0], pp[1]), spoken = speakable(orig).trim();
        if (!spoken) return;
        var lead = orig.length - orig.replace(/^\s+/, '').length;
        var u = new SpeechSynthesisUtterance(spoken); u.lang = 'en-US'; u.rate = 0.85;
        u.onstart = function () { if (reading === mine && mine) { mine.i = i; mine.w = null; draw(); } };
        u.onboundary = function (ev) {                      // word highlight only when the spoken text lines up with the shown text
          if (reading !== mine || !mine || ev.name !== 'word' || speakable(orig).trim().length !== orig.trim().length) return;
          var a = pp[0] + lead + ev.charIndex, n = ev.charLength || ((spoken.slice(ev.charIndex).match(/^\S+/) || [''])[0].length);
          mine.w = [a, a + n]; draw();
        };
        if (i === parts.length - 1) u.onend = function () { speaking = false; if (reading === mine) { reading = null; draw(); } };
        u.onerror = function () { speaking = false; if (reading === mine) { reading = null; draw(); } };
        tts.speak(u);
      });
    }
    function readingBubble(who, text) {                     // the message being read: dim text, current sentence lit, current word marked
      var b = el('msg claude reading'); b.appendChild(el('who', who));
      var R = reading, at = 0;
      R.parts.forEach(function (pp, i) {
        if (pp[0] > at) b.appendChild(document.createTextNode(text.slice(at, pp[0])));
        var sp = document.createElement('span'); sp.className = i === R.i ? 'hl-s' : (i < R.i ? 'done' : '');
        if (i === R.i && R.w && R.w[0] >= pp[0] && R.w[1] <= pp[1]) {
          sp.appendChild(document.createTextNode(text.slice(pp[0], R.w[0])));
          var w = document.createElement('span'); w.className = 'hl-w'; w.textContent = text.slice(R.w[0], R.w[1]); sp.appendChild(w);
          sp.appendChild(document.createTextNode(text.slice(R.w[1], pp[1])));
        } else sp.textContent = text.slice(pp[0], pp[1]);
        b.appendChild(sp); at = pp[1];
      });
      if (at < text.length) b.appendChild(document.createTextNode(text.slice(at)));
      return b;
    }

    // ---- key storage: IndexedDB, keys are non-extractable ----
    function db() {
      return new Promise(function (res, rej) {
        var r = indexedDB.open('glasses-link', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
      });
    }
    function kvGet(k) { return db().then(function (d) { return new Promise(function (res) { var q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(undefined); }; }); }); }
    function kvSet(k, v) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }); }
    function kvDel(k) { return db().then(function (d) { return new Promise(function (res) { var t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); }); }

    // ---- crypto: same as devlink2.py on the control box ----
    function deriveAll(words) {
      var phrase = words.join(' ').toLowerCase();
      return crypto.subtle.importKey('raw', enc.encode(phrase), 'PBKDF2', false, ['deriveBits'])
        .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(SALT), iterations: ITER }, base, 256); })
        .then(function (kbits) { return crypto.subtle.importKey('raw', kbits, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']); })
        .then(function (master) {
          var lab = function (l) { return crypto.subtle.sign('HMAC', master, enc.encode(l)); };
          return Promise.all([lab('mac'), lab('enc'), lab('device')]);
        })
        .then(function (sub) {
          return Promise.all([
            crypto.subtle.importKey('raw', sub[0], { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']),
            crypto.subtle.importKey('raw', sub[1], { name: 'AES-GCM' }, false, ['decrypt']),
            hex(sub[2])
          ]);
        })
        .then(function (k) { return { mac: k[0], enc: k[1], device: k[2] }; });
    }
    function signMsg(m) {
      var canon = [m.target, m.kind, String(m.ctr), String(m.ts), m.text || ''].join('\n');
      return crypto.subtle.sign('HMAC', K.mac, enc.encode(canon)).then(hex);
    }
    function decrypt(blob) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv), additionalData: enc.encode(SALT) }, K.enc, b64(blob.ct))
        .then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
    }
    window.__glassesSelfTest = function (words, m) {      // for the local exam only (uses throwaway words)
      return deriveAll(words).then(function (k) { var old = K; K = k; return signMsg(m).then(function (sig) { K = old; return { device: k.device, sig: sig }; }); });
    };

    // ---- relay ----
    function api(path, body) {
      body = body || {};
      body.device = K && K.device;
      if (S.session) body.session = S.session;
      return fetch(RELAY + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
    }
    function failed(j) {
      if (j._status === 401 && /Not paired/.test(j.error || '')) { S.mode = 'pair'; S.words = []; S.session = ''; }
      else if (j._status === 401) { S.session = ''; S.mode = 'pin'; S.pin = [0, 0, 0, 0]; S.at = 0; }
      else if (j._status === 423) { S.mode = 'pair'; S.words = []; S.session = ''; }
      S.msg = j.error || ('Error ' + j._status); draw();
    }

    // ---- words from speech: snap each to the nearest list word ----
    function dist(a, b) {
      var d = []; for (var i = 0; i <= a.length; i++) { d[i] = [i]; } for (var j = 1; j <= b.length; j++) d[0][j] = j;
      for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      return d[a.length][b.length];
    }
    var WSET = {}; WORDS.forEach(function (w) { WSET[w] = 1; });
    function snap(raw) {                                   // case never matters: "Rabbit" = "rabbit"
      var t = raw.toLowerCase().split(/[^a-z]+/).filter(Boolean), out = [];
      for (var i = 0; i < t.length; i++) {
        if (i + 1 < t.length && !WSET[t[i]] && WSET[t[i] + t[i + 1]]) { out.push(t[i] + t[i + 1]); i++; continue; }   // "sun flower"
        var w = t[i];
        if (WSET[w]) { out.push(w); continue; }

        if (k === 'ArrowLeft') { if (ready) S.words = []; else S.words.pop(); S.msg = ''; draw(); return; }
        if (k === 'Enter') listen(function (said) {
          var got = snap(said); S.words = S.words.concat(got).slice(0, NWORDS);
          var bad = S.words.filter(function (x) { return x[0] === '?'; }).length;
          S.msg = !said ? "Didn't catch that." : bad ? bad + ' word(s) not recognised (red). Swipe left to remove the last word.' : (S.words.length < NWORDS ? (NWORDS - S.words.length) + ' more word(s).' : 'All ' + NWORDS + ' words heard. Check them, then pinch.');
          draw();
        });
        return;
      }
      if (S.mode === 'newpin' || S.mode === 'pin') {
        if (k === 'ArrowUp') S.pin[S.at] = (S.pin[S.at] + 1) % 10;
        else if (k === 'ArrowDown') S.pin[S.at] = (S.pin[S.at] + 9) % 10;
        else if (k === 'ArrowRight') S.at = Math.min(3, S.at + 1);
        else if (k === 'ArrowLeft') S.at = Math.max(0, S.at - 1);
        else if (k === 'Enter') { if (S.at < 3) S.at++; else { pinDone(); return; } }
        draw(); return;
      }
      if (S.mode === 'music') {
        if (k === 'Enter') musicToggle();
        else if (k === 'ArrowUp') musicVol(10);
        else if (k === 'ArrowDown') musicVol(-10);
        else if (k === 'ArrowLeft') { goWindow(1); return; }
        draw(); return;
      }
      if (S.mode === 'home') {
        var N = TARGETS.length + 1, pos = S.onMusic ? TARGETS.length : S.target;
        if (k === 'ArrowDown' || k === 'ArrowRight') pos = (pos + 1) % N;
        else if (k === 'ArrowUp' || k === 'ArrowLeft') pos = (pos + N - 1) % N;
        if (pos === TARGETS.length) S.onMusic = true; else { S.onMusic = false; S.target = pos; }
        if (k === 'Enter' && S.onMusic) { history.pushState({ v: 'music' }, '', location.href); S.mode = 'music'; S.msg = ''; }
        else if (k === 'Enter') { history.pushState({ v: 'chat' }, '', location.href); S.mode = 'chat'; S.msg = ''; poll(); }
        draw(); return;
      }
      if (S.mode === 'confirm') {
        if (k === 'ArrowLeft' || k === 'ArrowRight') {                                 // edit: say the message again; the new words replace the old
          var old = S.draft; S.taps = 0; stopSpeaking(); S.mode = 'chat'; S.msg = 'Say it again';
          listen(function (said) {
            S.mode = 'confirm'; S.taps = 0;
            if (!said) { S.draft = old; S.msg = "Didn't catch that. Kept the old words."; draw(); return; }
            S.draft = said; S.msg = 'Changed.'; draw(); say('Send: ' + said + '? Pinch twice to send.', true);
          });
          return;
        }
        if (k === 'Enter') {
          var now = Date.now();
          S.taps = (S.taps && now - S.tapAt < 4000) ? S.taps + 1 : 1; S.tapAt = now;
          if (S.taps < 2) { S.msg = '1 of 2 · pinch once more to send'; draw(); return; }
          S.taps = 0; stopSpeaking();
          send('text', S.draft).then(function (ok) { if (ok) { S.mode = 'chat'; S.draft = ''; S.msg = 'Sent ✓'; say('Sent.', true); draw(); } });
        }
        return;
      }
      if (S.mode === 'chat') {
        if (k === 'ArrowLeft') { goWindow(1); return; }              // swipe left = next window
        if (k === 'ArrowRight') { readReply(); return; }              // swipe right = read the reply (again = stop)
        var q = question();
        if (q && k === 'Enter' && target().noApprove) { S.msg = 'Approve this at the terminal or phone.'; draw(); return; }
        if (q && (k === 'Enter' || k === 'ArrowDown')) {
          var kind = k === 'Enter' ? 'approve' : 'deny', t = target().id;
          send(kind, '').then(function (ok) { if (ok) { S.answered[t] = q; S.msg = kind === 'approve' ? 'Approved ✓' : 'Refused ✓'; draw(); } });
          return;
        }
        if (k === 'ArrowDown') { bodyEl.scrollTop += Math.round(bodyEl.clientHeight * 0.8); return; }
        if (k === 'ArrowUp') { bodyEl.scrollTop -= Math.round(bodyEl.clientHeight * 0.8); return; }
        if (k === 'Enter') {
          var nowL = Date.now();
          S.ltaps = (S.ltaps && nowL - S.ltapAt < 4000) ? S.ltaps + 1 : 1; S.ltapAt = nowL;
          if (S.ltaps < 2) { S.msg = 'Pinch once more to ' + (target().ask ? 'ask' : 'speak'); draw(); return; }
          S.ltaps = 0; S.msg = '';
        }
        if (k === 'Enter') listen(function (said) {
          if (!said) { if (!S.msg) S.msg = "Didn't catch that."; draw(); return; }
          if (target().ask) {
            send('text', said).then(function (ok) { if (ok) { S.msg = 'Asked ✓ · answer in a few seconds'; say('Asking.', true); draw(); } });
            return;
          }
          S.draft = said; S.mode = 'confirm'; S.taps = 0; S.msg = ''; draw(); say('Send: ' + said + '? Pinch twice to send.', true);
        });
      }
    });

    // ---- start ----
    Promise.all([kvGet('mac'), kvGet('enc'), kvGet('device'), kvGet('ctr')]).then(function (v) {
      if (v[0] && v[1] && v[2]) { K = { mac: v[0], enc: v[1], device: v[2] }; S.lastCtr = v[3] || 0; S.mode = 'pin'; }
      else S.mode = 'pair';
      draw();
    }).catch(function () { S.mode = 'pair'; S.msg = 'Storage not available: pairing will not be remembered.'; draw(); });
    setInterval(function () { if (S.mode === 'chat' || S.mode === 'home') poll(); }, 2500);
    setInterval(function () { if (S.mode === 'chat' || S.mode === 'home' || S.mode === 'confirm' || S.mode === 'music') draw(); }, 30000);
    // Update check (Taha 2026-11-25): the glasses keep old copies of this page. Every 5 min fetch this page fresh;
    // if its PAGE_V differs, reload under a new address, but only on the home or PIN screen, after 60 s without a key,
    // with the mic and music off. Nothing else is fetched or run: the new page loads normally (same CSP, same pairing).
    var lastKey = Date.now(), updateTo = '';
    document.addEventListener('keydown', function () { lastKey = Date.now(); }, true);
    function checkUpdate() {
      fetch(location.pathname + '?u=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
        var m = /var PAGE_V = '([0-9a-z-]{1,20})'/.exec(t);
        if (m && m[1] !== PAGE_V) updateTo = m[1];
      }).catch(function () {});
    }
    setTimeout(checkUpdate, 20000); setInterval(checkUpdate, 300000);
    setInterval(function () {
      if (updateTo && (S.mode === 'home' || S.mode === 'pin') && !S.listening && !music.on && Date.now() - lastKey > 60000) {
        try { if (sessionStorage.getItem('gl-upd-tried') === updateTo) { updateTo = ''; return; } sessionStorage.setItem('gl-upd-tried', updateTo); } catch (e) { updateTo = ''; return; }   // one try per version: never a reload loop
        location.replace(location.pathname + '?v=' + encodeURIComponent(updateTo));
      }
    }, 5000);
  })();
  </script>
</body>
</html>
